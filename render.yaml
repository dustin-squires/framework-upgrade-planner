services:
  - type: web
    name: framework-upgrade-planner
    runtime: ruby
    plan: free
    buildCommand: bundle install && npm ci && npm run build
    startCommand: bundle exec rails server -b 0.0.0.0 -p $PORT
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: SECRET_KEY_BASE
        generateValue: true
